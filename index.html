<script>(()=>{'use strict';const SESSION_KEY='cds_device_session_v2',LEGACY_KEY='cds_device_unlock_v1',enc=new TextEncoder(),dec=new TextDecoder(),payload=JSON.parse(document.getElementById('cds-protected-payload').textContent),form=document.getElementById('accessForm'),input=document.getElementById('accessPassword'),remember=document.getElementById('rememberDevice'),button=document.getElementById('accessButton'),logoutButton=document.getElementById('logoutButton'),toggle=document.getElementById('togglePassword'),message=document.getElementById('accessMessage'),access=document.getElementById('accessScreen'),frame=document.getElementById('appFrame');let operation=0;function b64(v){const s=atob(v),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}function toB64(bytes){let s='',chunk=32768;for(let i=0;i<bytes.length;i+=chunk)s+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(s)}async function derive(value){const material=await crypto.subtle.importKey('raw',enc.encode(value),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['decrypt'])}async function importRaw(value){return crypto.subtle.importKey('raw',b64(value),{name:'AES-GCM'},true,['decrypt'])}async function fingerprint(key){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key)),hash=new Uint8Array(await crypto.subtle.digest('SHA-256',raw));return toB64(hash.subarray(0,18)).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')}async function decrypt(key){const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv),additionalData:enc.encode(payload.aad)},key,b64(payload.ciphertext));return dec.decode(clear)}function clearSession(){try{localStorage.removeItem(SESSION_KEY);localStorage.removeItem(LEGACY_KEY)}catch(error){}}async function saveSession(key){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key)),record={v:2,id:payload.keyId,key:toB64(raw)};localStorage.setItem(SESSION_KEY,JSON.stringify(record));try{localStorage.removeItem(LEGACY_KEY)}catch(error){}}function readSession(){try{const modern=localStorage.getItem(SESSION_KEY);if(modern){const parsed=JSON.parse(modern);if(parsed&&parsed.v===2&&parsed.id===payload.keyId&&parsed.key)return {key:parsed.key,legacy:false};localStorage.removeItem(SESSION_KEY)}const legacy=localStorage.getItem(LEGACY_KEY);if(legacy)return {key:legacy,legacy:true}}catch(error){}return null}function busy(text){button.disabled=true;button.textContent=text;message.textContent='';message.className='message'}function ready(){button.disabled=false;button.textContent='ACCEDER'}function showLogin(text,success){frame.classList.add('hidden');frame.removeAttribute('srcdoc');access.classList.remove('hidden');document.documentElement.classList.remove('app-open');document.title='Acceso · CAJÓN DE SASTRE';message.textContent=text||'';message.className=success?'message success':'message';ready();logoutButton.disabled=!readSession();if(!readSession())input.focus()}function openApp(html,token){return new Promise(resolve=>{let finished=false;const done=()=>{if(finished)return;finished=true;if(token!==operation){resolve(false);return}ready();access.classList.add('hidden');frame.classList.remove('hidden');document.documentElement.classList.add('app-open');document.title='CAJÓN DE SASTRE';resolve(true)};frame.srcdoc=html;if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(done));setTimeout(done,120)})}async function useKey(key,shouldRemember,token){const id=await fingerprint(key);if(payload.keyId&&id!==payload.keyId)throw new Error('Clave no válida');const html=await decrypt(key);if(token!==operation)return false;if(shouldRemember)await saveSession(key);else clearSession();return openApp(html,token)}form.addEventListener('submit',async event=>{event.preventDefault();const token=++operation;busy('COMPROBANDO…');try{const key=await derive(input.value);await useKey(key,remember.checked,token)}catch(error){if(token!==operation)return;message.textContent='Contraseña incorrecta. Comprueba el texto e inténtalo de nuevo.';input.select();ready()}});toggle.addEventListener('click',()=>{const visible=input.type==='text';input.type=visible?'password':'text';toggle.classList.toggle('visible',!visible);toggle.setAttribute('aria-label',visible?'Mostrar contraseña':'Ocultar contraseña');toggle.setAttribute('aria-pressed',String(!visible));input.focus()});logoutButton.addEventListener('click',()=>{operation++;clearSession();input.value='';showLogin('Sesión cerrada correctamente. La memoria de trabajo se conserva.',true)});window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||!event.data||event.data.type!=='cds:logout')return;operation++;clearSession();input.value='';showLogin('Sesión cerrada correctamente. La memoria de trabajo se conserva.',true)});(async()=>{if(!window.crypto||!crypto.subtle){message.textContent='Este navegador no admite el sistema de cifrado necesario.';button.disabled=true;return}const saved=readSession();logoutButton.disabled=!saved;if(!saved){input.focus();return}const token=++operation;busy('ABRIENDO…');try{const key=await importRaw(saved.key);await useKey(key,true,token)}catch(error){if(token!==operation)return;clearSession();showLogin('La sesión guardada ya no es válida. Introduce la contraseña de nuevo.',false)}})()})();</script></body></html>
